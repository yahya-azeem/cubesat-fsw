<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1U CubeSat — Live Orbit</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #02030a; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 18px; left: 18px; z-index: 10;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    color: #cfe6ff; background: rgba(6, 14, 30, 0.82);
    border: 1px solid rgba(80, 160, 255, 0.35);
    border-radius: 12px; padding: 14px 16px; min-width: 240px;
    backdrop-filter: blur(8px); box-shadow: 0 10px 40px rgba(0,0,0,.45);
  }
  #hud h1 { font-size: 13px; letter-spacing: .12em; text-transform: uppercase;
            margin: 0 0 10px; color: #7fb6ff; font-weight: 600; }
  .row { display: flex; justify-content: space-between; gap: 18px; font-size: 12px;
         line-height: 1.7; }
  .k { color: #6f8bb5; }
  .v { color: #eaf4ff; }
  #status { margin-top: 10px; font-size: 11px; color: #7fa7d8; }
  #status.bad { color: #ff9b9b; }
  #legend { position: fixed; bottom: 14px; left: 18px; font: 11px ui-monospace, monospace;
            color: #6f8bb5; z-index: 10; }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; }
</style>
</head>
<body>
<div id="hud">
  <h1>1U CubeSat · Live Orbit</h1>
  <div class="row"><span class="k">altitude</span><span class="v" id="alt">—</span></div>
  <div class="row"><span class="k">speed</span><span class="v" id="speed">—</span></div>
  <div class="row"><span class="k">lat / lon</span><span class="v" id="latlon">—</span></div>
  <div class="row"><span class="k">ET</span><span class="v" id="et">—</span></div>
  <div id="status">waiting for GDS telemetry…</div>
</div>
<div id="legend"><span class="dot" style="background:#35d0ff"></span>orbit
  &nbsp; <span class="dot" style="background:#ffcc33"></span>sun
  &nbsp; <span class="dot" style="background:#ff5d5d"></span>nadir</div>
<script type="module" src="./orbit.js"></script>
</body>
</html>
